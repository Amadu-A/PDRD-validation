# compose.yaml

name: ${COMPOSE_PROJECT_NAME:-drawing-validation-ai}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: dva-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - app-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.34.5}
    container_name: dva-n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      pdf-service:
        condition: service_healthy

    ports:
      - "${N8N_PORT:-5678}:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/

      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Moscow}
      TZ: ${GENERIC_TIMEZONE:-Europe/Moscow}

      OLLAMA_BASE_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      PDF_SERVICE_URL: http://pdf-service:8101

    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/files/workflows:ro

    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.0}
    container_name: dva-qdrant
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - app-net

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.9}
    container_name: dva-ollama
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT:-11434}:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    networks:
      - app-net

  pdf-service:
    build:
      context: ./services/pdf-service

    container_name: dva-pdf-service
    restart: unless-stopped

    depends_on:
      - ollama

    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:2b-instruct}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-1800}

      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1400}
      OLLAMA_MAX_ISSUES: ${OLLAMA_MAX_ISSUES:-3}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}

      PDF_RENDER_MAX_SIDE: ${PDF_RENDER_MAX_SIDE:-2400}
      PDF_MAX_ANALYSIS_PAGES: ${PDF_MAX_ANALYSIS_PAGES:-50}
      PDF_TEXT_LIMIT: ${PDF_TEXT_LIMIT:-12000}

    ports:
      - "${PDF_SERVICE_PORT:-8101}:8101"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/live', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app-net

  frontend:
    build:
      context: ./frontend

    container_name: dva-frontend
    restart: unless-stopped

    depends_on:
      - n8n

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    networks:
      - app-net

volumes:
  postgres_data:
  n8n_data:
  qdrant_data:
  ollama_data:

networks:
  app-net:
    driver: bridge
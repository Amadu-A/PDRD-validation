# compose.yaml
# Проектный Docker-стек PDRD и серверный Review на основном frontend.
#
# Shared: RabbitMQ, n8n, shared-vlm, shared-embedding.
# Project-specific: PostgreSQL, Qdrant и application services.

name: ${COMPOSE_PROJECT_NAME:-pdrd-validation-ai}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-app-env-files: &app-env-files
  - .env.example
  - .env

x-api-gateway-environment: &api-gateway-environment
  API_GATEWAY_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
  API_GATEWAY_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
  API_GATEWAY_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

  API_GATEWAY_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
  API_GATEWAY_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
  API_GATEWAY_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
  API_GATEWAY_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
  API_GATEWAY_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}

x-knowledge-service-environment: &knowledge-service-environment
  KNOWLEDGE_SERVICE_EXPERIENCE__KEY: ${PDRD_EXPERIENCE_INDEX_KEY:-}
  KNOWLEDGE_SERVICE_DATABASE__HOST: postgres
  KNOWLEDGE_SERVICE_DATABASE__PORT: 5432
  KNOWLEDGE_SERVICE_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
  KNOWLEDGE_SERVICE_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
  KNOWLEDGE_SERVICE_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

  KNOWLEDGE_SERVICE_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
  KNOWLEDGE_SERVICE_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
  KNOWLEDGE_SERVICE_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
  KNOWLEDGE_SERVICE_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
  KNOWLEDGE_SERVICE_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}

  KNOWLEDGE_SERVICE_EMBEDDING__BASE_URL: ${PDRD_SHARED_EMBEDDING_BASE_URL:-http://shared-embedding:8000/v1}
  KNOWLEDGE_SERVICE_MULTIMODAL_EMBEDDING__BASE_URL: ${PDRD_SHARED_EMBEDDING_BASE_URL:-http://shared-embedding:8000/v1}

x-experience-environment: &experience-environment
  EXPERIENCE_SERVICE_INDEX_KEY: ${PDRD_EXPERIENCE_INDEX_KEY:-}
  EXPERIENCE_SERVICE_ENABLED: "true"
  EXPERIENCE_SERVICE_DATABASE__HOST: postgres
  EXPERIENCE_SERVICE_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
  EXPERIENCE_SERVICE_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
  EXPERIENCE_SERVICE_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}
  EXPERIENCE_SERVICE_REVIEW_API_ENABLED: ${API_GATEWAY_REVIEW__ENABLED:-false}
  EXPERIENCE_SERVICE_INTERNAL_KEY: ${API_GATEWAY_REVIEW__INTERNAL_KEY:-}

x-user-service-database-environment: &user-service-database-environment
  USER_SERVICE_DATABASE__HOST: postgres
  USER_SERVICE_DATABASE__PORT: 5432
  USER_SERVICE_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
  USER_SERVICE_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
  USER_SERVICE_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

services:
  postgres:
    image: postgres:${PDRD_POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PDRD_POSTGRES_DB:-pdrd}
      POSTGRES_USER: ${PDRD_POSTGRES_USER:-pdrd}
      POSTGRES_PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums

    ports:
      - "${PDRD_POSTGRES_BIND_IP:-0.0.0.0}:${PDRD_POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PDRD_POSTGRES_USER:-pdrd} -d ${PDRD_POSTGRES_DB:-pdrd}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    logging: *default-logging

    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.0}
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    logging: *default-logging

    networks:
      - app-net

  quality-tests:
    build:
      context: .
      dockerfile: ops/Dockerfile.quality

    profiles:
      - test

  api-gateway:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *api-gateway-environment

    volumes:
      - analysis_artifacts:/data/analyses

    ports:
      - "${API_GATEWAY_BIND_IP:-127.0.0.1}:${API_GATEWAY_HOST_PORT:-8200}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  api-gateway-outbox:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *api-gateway-environment

    command:
      [
        "python",
        "-m",
        "pdrd_api_gateway.infrastructure.messaging.dispatcher"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  api-gateway-worker:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *api-gateway-environment

    command:
      [
        "celery",
        "-A",
        "pdrd_api_gateway.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${PDRD_CELERY_CONCURRENCY:-1}",
        "--hostname=pdrd-analysis@%h"
      ]

    volumes:
      - analysis_artifacts:/data/analyses

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A pdrd_api_gateway.infrastructure.messaging.celery_app:celery_app inspect ping -d \"pdrd-analysis@$$HOSTNAME\" --timeout=5 | grep -q pong"
        ]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

      knowledge-service:
        condition: service_healthy

    stop_grace_period: 30s

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  api-gateway-tests:
    build:
      context: ./services/api-gateway
      target: test

    profiles:
      - test

    env_file: *app-env-files

    environment:
      <<: *api-gateway-environment
      API_GATEWAY_ENVIRONMENT: test
      PDRD_RUN_DATABASE_TESTS: "1"
      PDRD_RUN_BROKER_TESTS: "1"

    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && pytest -q /app/tests"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      api-gateway-worker:
        condition: service_healthy

    networks:
      - app-net
      - ai-shared

  document-service:
    build:
      context: ./services/document-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    ports:
      - "${DOCUMENT_SERVICE_BIND_IP:-127.0.0.1}:${DOCUMENT_SERVICE_HOST_PORT:-8301}:8301"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8301/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging: *default-logging

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-document-service

  knowledge-embedding-migrator:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: "no"

    env_file: *app-env-files

    environment: *knowledge-service-environment

    command:
      [
        "python",
        "-m",
        "pdrd_knowledge_service.infrastructure.migration.embedding_index_migrator"
      ]

    volumes:
      - normative_documents:/data/normative
      - technical_assignment_documents:/data/technical-assignments

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  knowledge-service:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *knowledge-service-environment

    volumes:
      - normative_documents:/data/normative
      - technical_assignment_documents:/data/technical-assignments
      - experience_index_quality:/data/experience-quality

    ports:
      - "${KNOWLEDGE_SERVICE_BIND_IP:-127.0.0.1}:${KNOWLEDGE_SERVICE_HOST_PORT:-8401}:8401"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8401/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      knowledge-embedding-migrator:
        condition: service_completed_successfully

    logging: *default-logging

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-knowledge-service

  knowledge-service-outbox:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *knowledge-service-environment

    command:
      [
        "python",
        "-m",
        "pdrd_knowledge_service.infrastructure.messaging.dispatcher"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      knowledge-embedding-migrator:
        condition: service_completed_successfully

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  knowledge-indexer:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *knowledge-service-environment

    command:
      [
        "celery",
        "-A",
        "pdrd_knowledge_service.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${PDRD_KNOWLEDGE_INDEXER_CONCURRENCY:-1}",
        "--queues=pdrd.knowledge.indexing",
        "--hostname=pdrd-knowledge-indexer@%h"
      ]

    volumes:
      - normative_documents:/data/normative

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A pdrd_knowledge_service.infrastructure.messaging.celery_app:celery_app inspect ping -d \"pdrd-knowledge-indexer@$$HOSTNAME\" --timeout=5 | grep -q pong"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      knowledge-embedding-migrator:
        condition: service_completed_successfully

    stop_grace_period: 30s

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  technical-assignment-indexer:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    environment: *knowledge-service-environment

    command:
      [
        "celery",
        "-A",
        "pdrd_knowledge_service.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--prefetch-multiplier=1",
        "--queues=pdrd.knowledge.technical-assignment",
        "--hostname=pdrd-technical-assignment@%h"
      ]

    volumes:
      - technical_assignment_documents:/data/technical-assignments

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A pdrd_knowledge_service.infrastructure.messaging.celery_app:celery_app inspect ping -d \"pdrd-technical-assignment@$$HOSTNAME\" --timeout=5 | grep -q pong"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      knowledge-embedding-migrator:
        condition: service_completed_successfully

    stop_grace_period: 60s

    logging: *default-logging

    networks:
      - app-net
      - ai-shared

  knowledge-service-tests:
    build:
      context: ./services/knowledge-service
      target: test

    profiles:
      - test

    env_file: *app-env-files

    environment:
      <<: *knowledge-service-environment
      KNOWLEDGE_SERVICE_ENVIRONMENT: test
      PDRD_RUN_DATABASE_TESTS: "1"

    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && pytest -q /app/tests"
      ]

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-net

  analysis-service:
    build:
      context: ./services/analysis-service
      target: runtime

    restart: unless-stopped

    env_file: *app-env-files

    volumes:
      - analysis_vlm_cache:/data/vlm-cache

    ports:
      - "${ANALYSIS_SERVICE_BIND_IP:-127.0.0.1}:${ANALYSIS_SERVICE_HOST_PORT:-8501}:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

    logging: *default-logging

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-analysis-service

  vlm-runtime-tests:
    build:
      context: .
      dockerfile: ops/Dockerfile.quality

    profiles:
      - vlm-runtime-test

    env_file: *app-env-files

    environment:
      PDRD_RUN_VLM_RUNTIME_TESTS: "1"

    command:
      [
        "python",
        "-m",
        "pytest",
        "tests/runtime/test_shared_vlm_runtime.py",
        "-q",
        "--import-mode=importlib"
      ]

    depends_on:
      analysis-service:
        condition: service_healthy

    networks:
      - app-net
      - ai-shared

  user-migrate:
    build:
      context: ./services/user-service
      target: runtime
    profiles: [identity]
    restart: "no"
    environment: *user-service-database-environment
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [app-net]

  user-service:
    build:
      context: ./services/user-service
      target: runtime
    profiles: [identity]
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      <<: *user-service-database-environment
      USER_SERVICE_ENABLED: "true"
      USER_SERVICE_INTERNAL_KEY: ${USER_SERVICE_INTERNAL_KEY:-}
    depends_on:
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    networks: [app-net]

  experience-migrate:
    build:
      context: ./services/experience-service
      target: runtime
    profiles: [review]
    restart: "no"
    env_file: *app-env-files
    environment: *experience-environment
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [app-net]

  experience-service:
    build:
      context: ./services/experience-service
      target: runtime
    profiles: [review]
    restart: unless-stopped
    env_file: *app-env-files
    environment: *experience-environment
    volumes:
      - experience_crops:/data/experience/crops
    depends_on:
      experience-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [app-net]

  review-frontend:
    build:
      context: ./frontend
    profiles: [review]
    restart: unless-stopped
    environment:
      PDRD_REVIEW_PROXY_KEY: ${API_GATEWAY_REVIEW__UI_KEY:-}
    ports:
      - "127.0.0.1:${REVIEW_FRONTEND_PORT:-8081}:80"
    depends_on:
      experience-service:
        condition: service_healthy
    logging: *default-logging
    networks: [app-net]

  experience-indexer:
    build:
      context: ./services/knowledge-service
      target: runtime
    profiles: [experience-index]
    restart: unless-stopped
    env_file: *app-env-files
    environment:
      <<: *knowledge-service-environment
      KNOWLEDGE_SERVICE_EXPERIENCE__INDEX_ENABLED: "true"
      KNOWLEDGE_SERVICE_EXPERIENCE__POLL_SECONDS: "30"
    command: ["python", "-m", "pdrd_knowledge_service.experience_runtime", "watch"]
    volumes:
      - experience_index_quality:/data/experience-quality
    depends_on:
      experience-service:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import json, time; from pathlib import Path; from pdrd_knowledge_service.core.settings import Settings; s=json.loads(Path('/tmp/experience-index-status.json').read_text()); assert time.time()-s['last_success'] < max(900, Settings().experience.poll_seconds*3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    logging: *default-logging
    networks: [app-net, ai-shared]

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    environment:
      # Серверный Review работает на основном фронте; ключ не передаётся браузеру.
      PDRD_REVIEW_PROXY_KEY: ${API_GATEWAY_REVIEW__UI_KEY:-}

    logging: *default-logging

    networks:
      - app-net

volumes:
  experience_index_quality:
  experience_crops:
  postgres_data:
  qdrant_data:
  analysis_artifacts:
  analysis_vlm_cache:
  normative_documents:
  technical_assignment_documents:

networks:
  app-net:
    driver: bridge

  ai-shared:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-ai-shared}

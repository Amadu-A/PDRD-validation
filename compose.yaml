# compose.yaml
# Project-specific Docker stack PDRD.
#
# Ollama, n8n и RabbitMQ принадлежат shared infrastructure.
# PostgreSQL, Qdrant и application services принадлежат PDRD.

name: ${COMPOSE_PROJECT_NAME:-pdrd-validation-ai}

services:
  postgres:
    image: postgres:${PDRD_POSTGRES_VERSION:-16-alpine}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PDRD_POSTGRES_DB:-pdrd}
      POSTGRES_USER: ${PDRD_POSTGRES_USER:-pdrd}
      POSTGRES_PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --data-checksums

    ports:
      - "${PDRD_POSTGRES_BIND_IP:-0.0.0.0}:${PDRD_POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PDRD_POSTGRES_USER:-pdrd} -d ${PDRD_POSTGRES_DB:-pdrd}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.0}
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - app-net

  quality-tests:
    build:
      context: .
      dockerfile: ops/Dockerfile.quality

    profiles:
      - test

  api-gateway:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    environment:
      API_GATEWAY_SERVICE_NAME: ${API_GATEWAY_SERVICE_NAME:-PDRD API Gateway}
      API_GATEWAY_SERVICE_VERSION: ${API_GATEWAY_SERVICE_VERSION:-0.1.0}
      API_GATEWAY_ENVIRONMENT: ${API_GATEWAY_ENVIRONMENT:-local}
      API_GATEWAY_HOST: 0.0.0.0
      API_GATEWAY_PORT: 8000
      API_GATEWAY_DOCS_ENABLED: ${API_GATEWAY_DOCS_ENABLED:-true}

      API_GATEWAY_DATABASE__HOST: postgres
      API_GATEWAY_DATABASE__PORT: 5432
      API_GATEWAY_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
      API_GATEWAY_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
      API_GATEWAY_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}
      API_GATEWAY_DATABASE__POOL_SIZE: ${API_GATEWAY_DATABASE__POOL_SIZE:-5}
      API_GATEWAY_DATABASE__MAX_OVERFLOW: ${API_GATEWAY_DATABASE__MAX_OVERFLOW:-10}
      API_GATEWAY_DATABASE__POOL_TIMEOUT_SECONDS: ${API_GATEWAY_DATABASE__POOL_TIMEOUT_SECONDS:-10}
      API_GATEWAY_DATABASE__CONNECT_TIMEOUT_SECONDS: ${API_GATEWAY_DATABASE__CONNECT_TIMEOUT_SECONDS:-5}
      API_GATEWAY_DATABASE__HEALTH_TIMEOUT_SECONDS: ${API_GATEWAY_DATABASE__HEALTH_TIMEOUT_SECONDS:-3}

      API_GATEWAY_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
      API_GATEWAY_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
      API_GATEWAY_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
      API_GATEWAY_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
      API_GATEWAY_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}
      API_GATEWAY_BROKER__QUEUE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__EXCHANGE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__ROUTING_KEY: analysis.execute

      API_GATEWAY_STORAGE__ROOT_PATH: /data/analyses

      API_GATEWAY_ORCHESTRATION__BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      API_GATEWAY_ORCHESTRATION__REQUEST_TIMEOUT_SECONDS: ${API_GATEWAY_ORCHESTRATION__REQUEST_TIMEOUT_SECONDS:-1800}
      API_GATEWAY_ORCHESTRATION__CONNECT_TIMEOUT_SECONDS: ${API_GATEWAY_ORCHESTRATION__CONNECT_TIMEOUT_SECONDS:-20}

    volumes:
      - analysis_artifacts:/data/analyses

    ports:
      - "${API_GATEWAY_BIND_IP:-127.0.0.1}:${API_GATEWAY_HOST_PORT:-8200}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - app-net
      - ai-shared

  api-gateway-outbox:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    command:
      [
        "python",
        "-m",
        "pdrd_api_gateway.infrastructure.messaging.dispatcher"
      ]

    environment:
      API_GATEWAY_ENVIRONMENT: ${API_GATEWAY_ENVIRONMENT:-local}

      API_GATEWAY_DATABASE__HOST: postgres
      API_GATEWAY_DATABASE__PORT: 5432
      API_GATEWAY_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
      API_GATEWAY_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
      API_GATEWAY_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

      API_GATEWAY_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
      API_GATEWAY_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
      API_GATEWAY_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
      API_GATEWAY_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
      API_GATEWAY_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}
      API_GATEWAY_BROKER__QUEUE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__EXCHANGE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__ROUTING_KEY: analysis.execute

      API_GATEWAY_OUTBOX__POLL_INTERVAL_SECONDS: ${API_GATEWAY_OUTBOX__POLL_INTERVAL_SECONDS:-1}
      API_GATEWAY_OUTBOX__BATCH_SIZE: ${API_GATEWAY_OUTBOX__BATCH_SIZE:-20}

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - app-net
      - ai-shared

  api-gateway-worker:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    command:
      [
        "celery",
        "-A",
        "pdrd_api_gateway.infrastructure.messaging.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${PDRD_CELERY_CONCURRENCY:-1}",
        "--hostname=pdrd-analysis@%h"
      ]

    environment:
      API_GATEWAY_ENVIRONMENT: ${API_GATEWAY_ENVIRONMENT:-local}

      API_GATEWAY_DATABASE__HOST: postgres
      API_GATEWAY_DATABASE__PORT: 5432
      API_GATEWAY_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
      API_GATEWAY_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
      API_GATEWAY_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

      API_GATEWAY_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
      API_GATEWAY_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
      API_GATEWAY_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
      API_GATEWAY_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
      API_GATEWAY_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}
      API_GATEWAY_BROKER__QUEUE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__EXCHANGE_NAME: pdrd.analysis
      API_GATEWAY_BROKER__ROUTING_KEY: analysis.execute

      API_GATEWAY_STORAGE__ROOT_PATH: /data/analyses

      API_GATEWAY_ORCHESTRATION__BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      API_GATEWAY_ORCHESTRATION__REQUEST_TIMEOUT_SECONDS: ${API_GATEWAY_ORCHESTRATION__REQUEST_TIMEOUT_SECONDS:-1800}
      API_GATEWAY_ORCHESTRATION__CONNECT_TIMEOUT_SECONDS: ${API_GATEWAY_ORCHESTRATION__CONNECT_TIMEOUT_SECONDS:-20}

      API_GATEWAY_PROJECT_CONTEXT_CLEANUP__BASE_URL: http://knowledge-service:8401
      API_GATEWAY_PROJECT_CONTEXT_CLEANUP__REQUEST_TIMEOUT_SECONDS: ${API_GATEWAY_PROJECT_CONTEXT_CLEANUP__REQUEST_TIMEOUT_SECONDS:-30}
      API_GATEWAY_PROJECT_CONTEXT_CLEANUP__CONNECT_TIMEOUT_SECONDS: ${API_GATEWAY_PROJECT_CONTEXT_CLEANUP__CONNECT_TIMEOUT_SECONDS:-10}

    volumes:
      - analysis_artifacts:/data/analyses

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A pdrd_api_gateway.infrastructure.messaging.celery_app:celery_app inspect ping -d \"pdrd-analysis@$$HOSTNAME\" --timeout=5 | grep -q pong"
        ]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 10s

    depends_on:
      postgres:
        condition: service_healthy

    stop_grace_period: 30s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - app-net
      - ai-shared

  api-gateway-tests:
    build:
      context: ./services/api-gateway
      target: test

    profiles:
      - test

    environment:
      API_GATEWAY_ENVIRONMENT: test

      API_GATEWAY_DATABASE__HOST: postgres
      API_GATEWAY_DATABASE__PORT: 5432
      API_GATEWAY_DATABASE__NAME: ${PDRD_POSTGRES_DB:-pdrd}
      API_GATEWAY_DATABASE__USER: ${PDRD_POSTGRES_USER:-pdrd}
      API_GATEWAY_DATABASE__PASSWORD: ${PDRD_POSTGRES_PASSWORD:?PDRD_POSTGRES_PASSWORD must be set in .env}

      API_GATEWAY_BROKER__HOST: ${PDRD_RABBITMQ_HOST:-rabbitmq}
      API_GATEWAY_BROKER__PORT: ${PDRD_RABBITMQ_PORT:-5672}
      API_GATEWAY_BROKER__USER: ${PDRD_RABBITMQ_USER:-pdrd_validation}
      API_GATEWAY_BROKER__PASSWORD: ${PDRD_RABBITMQ_PASSWORD:?PDRD_RABBITMQ_PASSWORD must be set in .env}
      API_GATEWAY_BROKER__VIRTUAL_HOST: ${PDRD_RABBITMQ_VHOST:-pdrd-validation}

      PDRD_RUN_DATABASE_TESTS: "1"
      PDRD_RUN_BROKER_TESTS: "1"

    command:
      [
        "/bin/sh",
        "-c",
        "alembic upgrade head && pytest -q /app/tests"
      ]

    depends_on:
      postgres:
        condition: service_healthy

      api-gateway-worker:
        condition: service_healthy

    networks:
      - app-net
      - ai-shared

  document-service:
    build:
      context: ./services/document-service
      target: runtime

    restart: unless-stopped

    environment:
      DOCUMENT_SERVICE_SERVICE_NAME: ${DOCUMENT_SERVICE_SERVICE_NAME:-PDRD Document Service}
      DOCUMENT_SERVICE_SERVICE_VERSION: ${DOCUMENT_SERVICE_SERVICE_VERSION:-0.1.0}
      DOCUMENT_SERVICE_ENVIRONMENT: ${DOCUMENT_SERVICE_ENVIRONMENT:-local}
      DOCUMENT_SERVICE_HOST: 0.0.0.0
      DOCUMENT_SERVICE_PORT: 8301
      DOCUMENT_SERVICE_DOCS_ENABLED: ${DOCUMENT_SERVICE_DOCS_ENABLED:-true}

      DOCUMENT_SERVICE_PDF__MAX_UPLOAD_MB: ${DOCUMENT_SERVICE_PDF__MAX_UPLOAD_MB:-200}
      DOCUMENT_SERVICE_PDF__RENDER_MAX_SIDE: ${DOCUMENT_SERVICE_PDF__RENDER_MAX_SIDE:-2400}
      DOCUMENT_SERVICE_PDF__MAX_ANALYSIS_PAGES: ${DOCUMENT_SERVICE_PDF__MAX_ANALYSIS_PAGES:-50}
      DOCUMENT_SERVICE_PDF__MAX_CONTEXT_PAGES: ${DOCUMENT_SERVICE_PDF__MAX_CONTEXT_PAGES:-100}
      DOCUMENT_SERVICE_PDF__TEXT_LIMIT: ${DOCUMENT_SERVICE_PDF__TEXT_LIMIT:-12000}

      DOCUMENT_SERVICE_CAD__MAX_UPLOAD_MB: ${DOCUMENT_SERVICE_CAD__MAX_UPLOAD_MB:-200}
      DOCUMENT_SERVICE_CAD__DWG_CONVERTER_COMMAND: ${DOCUMENT_SERVICE_CAD__DWG_CONVERTER_COMMAND:-dwg2dxf}
      DOCUMENT_SERVICE_CAD__DWG_CONVERTER_TIMEOUT_SECONDS: ${DOCUMENT_SERVICE_CAD__DWG_CONVERTER_TIMEOUT_SECONDS:-180}
      DOCUMENT_SERVICE_CAD__RENDER_DPI: ${DOCUMENT_SERVICE_CAD__RENDER_DPI:-180}
      DOCUMENT_SERVICE_CAD__RENDER_MAX_SIDE: ${DOCUMENT_SERVICE_CAD__RENDER_MAX_SIDE:-2600}
      DOCUMENT_SERVICE_CAD__MACHINE_TEXT_LIMIT: ${DOCUMENT_SERVICE_CAD__MACHINE_TEXT_LIMIT:-14000}
      DOCUMENT_SERVICE_CAD__TEXT_SAMPLE_LIMIT: ${DOCUMENT_SERVICE_CAD__TEXT_SAMPLE_LIMIT:-160}
      DOCUMENT_SERVICE_CAD__BLOCK_SAMPLE_LIMIT: ${DOCUMENT_SERVICE_CAD__BLOCK_SAMPLE_LIMIT:-120}
      DOCUMENT_SERVICE_CAD__DANGLING_SAMPLE_LIMIT: ${DOCUMENT_SERVICE_CAD__DANGLING_SAMPLE_LIMIT:-120}
      DOCUMENT_SERVICE_CAD__CONNECTIVITY_TOLERANCE: ${DOCUMENT_SERVICE_CAD__CONNECTIVITY_TOLERANCE:-0.5}
      DOCUMENT_SERVICE_CAD__VIRTUAL_INSERT_DEPTH: ${DOCUMENT_SERVICE_CAD__VIRTUAL_INSERT_DEPTH:-2}

    ports:
      - "${DOCUMENT_SERVICE_BIND_IP:-127.0.0.1}:${DOCUMENT_SERVICE_HOST_PORT:-8301}:8301"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8301/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-document-service

  knowledge-service:
    build:
      context: ./services/knowledge-service
      target: runtime

    restart: unless-stopped

    environment:
      KNOWLEDGE_SERVICE_SERVICE_NAME: ${KNOWLEDGE_SERVICE_SERVICE_NAME:-PDRD Knowledge Service}
      KNOWLEDGE_SERVICE_SERVICE_VERSION: ${KNOWLEDGE_SERVICE_SERVICE_VERSION:-0.1.0}
      KNOWLEDGE_SERVICE_ENVIRONMENT: ${KNOWLEDGE_SERVICE_ENVIRONMENT:-local}
      KNOWLEDGE_SERVICE_HOST: 0.0.0.0
      KNOWLEDGE_SERVICE_PORT: 8401
      KNOWLEDGE_SERVICE_DOCS_ENABLED: ${KNOWLEDGE_SERVICE_DOCS_ENABLED:-true}

      KNOWLEDGE_SERVICE_EMBEDDING__BASE_URL: ${KNOWLEDGE_SERVICE_EMBEDDING__BASE_URL:-http://ollama:11434}
      KNOWLEDGE_SERVICE_EMBEDDING__MODEL: ${KNOWLEDGE_SERVICE_EMBEDDING__MODEL:-qwen3-embedding:4b}
      KNOWLEDGE_SERVICE_EMBEDDING__REQUEST_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_EMBEDDING__REQUEST_TIMEOUT_SECONDS:-900}
      KNOWLEDGE_SERVICE_EMBEDDING__CONNECT_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_EMBEDDING__CONNECT_TIMEOUT_SECONDS:-20}
      KNOWLEDGE_SERVICE_EMBEDDING__HEALTH_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_EMBEDDING__HEALTH_TIMEOUT_SECONDS:-5}

      KNOWLEDGE_SERVICE_QDRANT__BASE_URL: ${KNOWLEDGE_SERVICE_QDRANT__BASE_URL:-http://qdrant:6333}
      KNOWLEDGE_SERVICE_QDRANT__NORMATIVE_COLLECTION: ${KNOWLEDGE_SERVICE_QDRANT__NORMATIVE_COLLECTION:-dva_normative_v2}
      KNOWLEDGE_SERVICE_QDRANT__EXPERIENCE_COLLECTION: ${KNOWLEDGE_SERVICE_QDRANT__EXPERIENCE_COLLECTION:-dva_experience_v2}
      KNOWLEDGE_SERVICE_QDRANT__REQUEST_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_QDRANT__REQUEST_TIMEOUT_SECONDS:-90}
      KNOWLEDGE_SERVICE_QDRANT__HEALTH_TIMEOUT_SECONDS: ${KNOWLEDGE_SERVICE_QDRANT__HEALTH_TIMEOUT_SECONDS:-5}

      KNOWLEDGE_SERVICE_SEARCH__NORMATIVE_TOP_K: ${KNOWLEDGE_SERVICE_SEARCH__NORMATIVE_TOP_K:-4}
      KNOWLEDGE_SERVICE_SEARCH__NORMATIVE_MAX_SOURCES: ${KNOWLEDGE_SERVICE_SEARCH__NORMATIVE_MAX_SOURCES:-12}
      KNOWLEDGE_SERVICE_SEARCH__EXPERIENCE_TOP_K: ${KNOWLEDGE_SERVICE_SEARCH__EXPERIENCE_TOP_K:-3}

      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__CHUNK_SIZE: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__CHUNK_SIZE:-1800}
      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__CHUNK_OVERLAP: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__CHUNK_OVERLAP:-250}
      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__TOP_K: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__TOP_K:-5}
      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__EMBED_BATCH_SIZE: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__EMBED_BATCH_SIZE:-12}
      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__UPSERT_BATCH_SIZE: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__UPSERT_BATCH_SIZE:-64}
      KNOWLEDGE_SERVICE_PROJECT_CONTEXT__COLLECTION_PREFIX: ${KNOWLEDGE_SERVICE_PROJECT_CONTEXT__COLLECTION_PREFIX:-pdrd_project_context}

    ports:
      - "${KNOWLEDGE_SERVICE_BIND_IP:-127.0.0.1}:${KNOWLEDGE_SERVICE_HOST_PORT:-8401}:8401"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8401/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

    depends_on:
      - qdrant

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-knowledge-service

  analysis-service:
    build:
      context: ./services/analysis-service
      target: runtime

    restart: unless-stopped

    environment:
      ANALYSIS_SERVICE_SERVICE_NAME: ${ANALYSIS_SERVICE_SERVICE_NAME:-PDRD Analysis Service}
      ANALYSIS_SERVICE_SERVICE_VERSION: ${ANALYSIS_SERVICE_SERVICE_VERSION:-0.1.0}
      ANALYSIS_SERVICE_ENVIRONMENT: ${ANALYSIS_SERVICE_ENVIRONMENT:-local}
      ANALYSIS_SERVICE_HOST: 0.0.0.0
      ANALYSIS_SERVICE_PORT: 8501
      ANALYSIS_SERVICE_DOCS_ENABLED: ${ANALYSIS_SERVICE_DOCS_ENABLED:-true}

      ANALYSIS_SERVICE_VISION__BASE_URL: ${ANALYSIS_SERVICE_VISION__BASE_URL:-http://ollama:11434}
      ANALYSIS_SERVICE_VISION__MODEL: ${ANALYSIS_SERVICE_VISION__MODEL:-qwen3-vl:8b-instruct}
      ANALYSIS_SERVICE_VISION__REQUEST_TIMEOUT_SECONDS: ${ANALYSIS_SERVICE_VISION__REQUEST_TIMEOUT_SECONDS:-1800}
      ANALYSIS_SERVICE_VISION__CONNECT_TIMEOUT_SECONDS: ${ANALYSIS_SERVICE_VISION__CONNECT_TIMEOUT_SECONDS:-20}
      ANALYSIS_SERVICE_VISION__HEALTH_TIMEOUT_SECONDS: ${ANALYSIS_SERVICE_VISION__HEALTH_TIMEOUT_SECONDS:-5}
      ANALYSIS_SERVICE_VISION__NUM_CTX: ${ANALYSIS_SERVICE_VISION__NUM_CTX:-16384}
      ANALYSIS_SERVICE_VISION__MAX_RETRIES: ${ANALYSIS_SERVICE_VISION__MAX_RETRIES:-2}
      ANALYSIS_SERVICE_VISION__KEEP_ALIVE: ${ANALYSIS_SERVICE_VISION__KEEP_ALIVE:-1m}
      ANALYSIS_SERVICE_VISION__MAX_RETRY_NUM_PREDICT: ${ANALYSIS_SERVICE_VISION__MAX_RETRY_NUM_PREDICT:-6000}

      ANALYSIS_SERVICE_PIPELINE__PAGE_FACTS_NUM_PREDICT: ${ANALYSIS_SERVICE_PIPELINE__PAGE_FACTS_NUM_PREDICT:-1600}
      ANALYSIS_SERVICE_PIPELINE__NORM_CHECK_NUM_PREDICT: ${ANALYSIS_SERVICE_PIPELINE__NORM_CHECK_NUM_PREDICT:-2600}
      ANALYSIS_SERVICE_PIPELINE__FINAL_NUM_PREDICT: ${ANALYSIS_SERVICE_PIPELINE__FINAL_NUM_PREDICT:-1800}
      ANALYSIS_SERVICE_PIPELINE__MAX_ISSUES: ${ANALYSIS_SERVICE_PIPELINE__MAX_ISSUES:-10}
      ANALYSIS_SERVICE_PIPELINE__FINAL_BATCH_SIZE: ${ANALYSIS_SERVICE_PIPELINE__FINAL_BATCH_SIZE:-2}
      ANALYSIS_SERVICE_PIPELINE__NORMATIVE_TEXT_LIMIT: ${ANALYSIS_SERVICE_PIPELINE__NORMATIVE_TEXT_LIMIT:-700}
      ANALYSIS_SERVICE_PIPELINE__EXPERIENCE_CONTEXT_LIMIT: ${ANALYSIS_SERVICE_PIPELINE__EXPERIENCE_CONTEXT_LIMIT:-600}
      ANALYSIS_SERVICE_PIPELINE__EXPERIENCE_MIN_SCORE: ${ANALYSIS_SERVICE_PIPELINE__EXPERIENCE_MIN_SCORE:-0.55}
      ANALYSIS_SERVICE_PIPELINE__MAX_NORMATIVE_QUERIES: ${ANALYSIS_SERVICE_PIPELINE__MAX_NORMATIVE_QUERIES:-7}
      ANALYSIS_SERVICE_PIPELINE__MAX_IMAGE_BYTES: ${ANALYSIS_SERVICE_PIPELINE__MAX_IMAGE_BYTES:-20971520}

      ANALYSIS_SERVICE_PROJECT_CONTEXT__CLASSIFY_BATCH_SIZE: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__CLASSIFY_BATCH_SIZE:-8}
      ANALYSIS_SERVICE_PROJECT_CONTEXT__CLASSIFY_NUM_PREDICT: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__CLASSIFY_NUM_PREDICT:-1200}
      ANALYSIS_SERVICE_PROJECT_CONTEXT__MIN_TEXT_LENGTH: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__MIN_TEXT_LENGTH:-80}
      ANALYSIS_SERVICE_PROJECT_CONTEXT__REJECT_CONFIDENCE: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__REJECT_CONFIDENCE:-0.75}
      ANALYSIS_SERVICE_PROJECT_CONTEXT__CONTEXT_TEXT_LIMIT: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__CONTEXT_TEXT_LIMIT:-900}
      ANALYSIS_SERVICE_PROJECT_CONTEXT__QUERY_SOURCE_TEXT_LIMIT: ${ANALYSIS_SERVICE_PROJECT_CONTEXT__QUERY_SOURCE_TEXT_LIMIT:-1500}

    ports:
      - "${ANALYSIS_SERVICE_BIND_IP:-127.0.0.1}:${ANALYSIS_SERVICE_HOST_PORT:-8501}:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/health/ready', timeout=5)"
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-analysis-service

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    networks:
      - app-net

volumes:
  postgres_data:
  qdrant_data:
  analysis_artifacts:

networks:
  app-net:
    driver: bridge

  ai-shared:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-ai-shared}
# compose.yaml
# Project-specific Docker stack PDRD.
#
# Ollama, n8n и RabbitMQ принадлежат shared infrastructure.
# Qdrant и application backend/frontend принадлежат непосредственно PDRD.

name: ${COMPOSE_PROJECT_NAME:-pdrd-validation-ai}

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.19.0}
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - app-net

  api-gateway:
    build:
      context: ./services/api-gateway
      target: runtime

    restart: unless-stopped

    environment:
      API_GATEWAY_SERVICE_NAME: ${API_GATEWAY_SERVICE_NAME:-PDRD API Gateway}
      API_GATEWAY_SERVICE_VERSION: ${API_GATEWAY_SERVICE_VERSION:-0.1.0}
      API_GATEWAY_ENVIRONMENT: ${API_GATEWAY_ENVIRONMENT:-local}
      API_GATEWAY_HOST: 0.0.0.0
      API_GATEWAY_PORT: 8000
      API_GATEWAY_DOCS_ENABLED: ${API_GATEWAY_DOCS_ENABLED:-true}

    ports:
      - "${API_GATEWAY_BIND_IP:-127.0.0.1}:${API_GATEWAY_HOST_PORT:-8200}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - app-net

  pdf-service:
    build:
      context: ./services/pdf-service

    restart: unless-stopped

    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:8b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:4b}
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-1800}

      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_MAX_ISSUES: ${OLLAMA_MAX_ISSUES:-10}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}

      OLLAMA_PAGE_FACTS_NUM_PREDICT: ${OLLAMA_PAGE_FACTS_NUM_PREDICT:-1600}
      OLLAMA_NORM_CHECK_NUM_PREDICT: ${OLLAMA_NORM_CHECK_NUM_PREDICT:-2600}
      OLLAMA_FINAL_NUM_PREDICT: ${OLLAMA_FINAL_NUM_PREDICT:-1800}

      QDRANT_URL: http://qdrant:6333
      QDRANT_NORMATIVE_COLLECTION: ${QDRANT_NORMATIVE_COLLECTION:-dva_normative_v2}
      QDRANT_EXPERIENCE_COLLECTION: ${QDRANT_EXPERIENCE_COLLECTION:-dva_experience_v2}

      RAG_NORMATIVE_TOP_K: ${RAG_NORMATIVE_TOP_K:-4}
      RAG_NORMATIVE_MAX_SOURCES: ${RAG_NORMATIVE_MAX_SOURCES:-12}
      RAG_EXPERIENCE_TOP_K: ${RAG_EXPERIENCE_TOP_K:-3}
      RAG_NORMATIVE_TEXT_LIMIT: ${RAG_NORMATIVE_TEXT_LIMIT:-700}
      RAG_EXPERIENCE_CONTEXT_LIMIT: ${RAG_EXPERIENCE_CONTEXT_LIMIT:-600}

      PROJECT_CONTEXT_CHUNK_SIZE: ${PROJECT_CONTEXT_CHUNK_SIZE:-1800}
      PROJECT_CONTEXT_CHUNK_OVERLAP: ${PROJECT_CONTEXT_CHUNK_OVERLAP:-250}
      PROJECT_CONTEXT_TOP_K: ${PROJECT_CONTEXT_TOP_K:-5}
      PROJECT_CONTEXT_TEXT_LIMIT: ${PROJECT_CONTEXT_TEXT_LIMIT:-900}
      PROJECT_CONTEXT_CLASSIFY_BATCH_SIZE: ${PROJECT_CONTEXT_CLASSIFY_BATCH_SIZE:-8}
      PROJECT_CONTEXT_CLASSIFY_NUM_PREDICT: ${PROJECT_CONTEXT_CLASSIFY_NUM_PREDICT:-1200}
      PROJECT_CONTEXT_EMBED_BATCH_SIZE: ${PROJECT_CONTEXT_EMBED_BATCH_SIZE:-12}
      PROJECT_CONTEXT_COLLECTION_PREFIX: ${PROJECT_CONTEXT_COLLECTION_PREFIX:-pdrd_project_context}

      CAD_MAX_UPLOAD_MB: ${CAD_MAX_UPLOAD_MB:-200}
      CAD_DWG_CONVERTER_COMMAND: ${CAD_DWG_CONVERTER_COMMAND:-dwg2dxf}
      CAD_DWG_CONVERTER_TIMEOUT: ${CAD_DWG_CONVERTER_TIMEOUT:-180}
      CAD_RENDER_DPI: ${CAD_RENDER_DPI:-180}
      CAD_RENDER_MAX_SIDE: ${CAD_RENDER_MAX_SIDE:-2600}
      CAD_COMBINED_MAX_SIDE: ${CAD_COMBINED_MAX_SIDE:-3200}
      CAD_MACHINE_TEXT_LIMIT: ${CAD_MACHINE_TEXT_LIMIT:-14000}
      CAD_TEXT_SAMPLE_LIMIT: ${CAD_TEXT_SAMPLE_LIMIT:-160}
      CAD_BLOCK_SAMPLE_LIMIT: ${CAD_BLOCK_SAMPLE_LIMIT:-120}
      CAD_DANGLING_SAMPLE_LIMIT: ${CAD_DANGLING_SAMPLE_LIMIT:-120}
      CAD_CONNECTIVITY_TOLERANCE: ${CAD_CONNECTIVITY_TOLERANCE:-0.5}
      CAD_VIRTUAL_INSERT_DEPTH: ${CAD_VIRTUAL_INSERT_DEPTH:-2}

      PDF_RENDER_MAX_SIDE: ${PDF_RENDER_MAX_SIDE:-2400}
      PDF_MAX_ANALYSIS_PAGES: ${PDF_MAX_ANALYSIS_PAGES:-50}
      PDF_TEXT_LIMIT: ${PDF_TEXT_LIMIT:-12000}

    volumes:
      - ./data/knowledge:/data/knowledge
      - ./scripts:/scripts:ro

    ports:
      - "${PDF_SERVICE_PORT:-8101}:8101"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/live', timeout=5)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    depends_on:
      - qdrant

    networks:
      app-net:
      ai-shared:
        aliases:
          - pdrd-pdf-service

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    environment:
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      NGINX_ENVSUBST_FILTER: ^N8N_BASE_URL$

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    networks:
      - app-net
      - ai-shared

volumes:
  qdrant_data:

networks:
  app-net:
    driver: bridge

  ai-shared:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-ai-shared}
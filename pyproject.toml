# pyproject.toml
# Единая конфигурация linting, formatting и pytest для monorepo PDRD.

[tool.ruff]
target-version = "py312"
line-length = 88

extend-exclude = [
    ".venv",
    ".venv-dev",
    "data",

    # Standalone scripts подготовки/индексации данных не входят
    # в runtime packages микросервисов и обслуживаются отдельно.
    "scripts",
]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
    "W",
]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

fixable = ["ALL"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]

testpaths = [
    "tests",
    "services/api-gateway/tests",
    "services/document-service/tests",
    "services/knowledge-service/tests",
    "services/analysis-service/tests",
    "services/multimodal-embedding-service/tests",
]

markers = [
    "database: integration tests requiring a real PostgreSQL instance",
    "gpu_runtime: integration tests requiring the real shared RTX GPU runtime",
]

asyncio_mode = "auto"
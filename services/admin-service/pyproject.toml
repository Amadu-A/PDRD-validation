# services/admin-service/pyproject.toml
# Зависимости внутреннего сервиса административных операций PDRD.

[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrd-admin-service"
version = "0.1.0"
description = "Оркестрация административных операций PDRD без прямого доступа к БД других сервисов."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10.0", "pytest-asyncio>=1.1,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

# services/auth-service/pyproject.toml
# Зависимости проверки корпоративных учётных данных через защищённый LDAP.

[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrd-auth-service"
version = "0.1.0"
description = "Корпоративная аутентификация и сессии PDRD."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "ldap3==2.9.1",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.0.52",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "database: isolated PostgreSQL integration tests requiring an explicit test URL",
]

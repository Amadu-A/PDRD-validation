# services/experience-service/pyproject.toml
# Isolated domain/application package; HTTP, DB and deployment follow later.

[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "pdrd-experience-service"
version = "0.1.0"
description = "PDRD human review and experience data contracts"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]